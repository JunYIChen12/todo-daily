name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: python -m compileall todo_server.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Ensure local runtime data is not committed
        shell: bash
        run: |
          test ! -e todo-data/store.json
          test ! -e todo-data/notified.json
