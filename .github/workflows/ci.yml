name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: compile
        run: python -m compileall todo_server.py tests

      - name: unit
        run: python -m unittest discover -s tests -v

      - name: no runtime data
        shell: bash
        run: |
          test ! -e todo-data/store.json
          test ! -e todo-data/notified.json
